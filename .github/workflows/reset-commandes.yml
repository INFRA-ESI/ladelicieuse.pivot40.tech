name: Remise à zéro des commandes (manuel)

# Supprime les commandes de la base de production et vide le journal d'activité (page « Historique » du back-office),
# en gardant au plus une commande, renommée LDD-0001. Rien n'est supprimé sans la confirmation « SUPPRIMER », et la base
# est sauvegardée (mongodump) juste avant. Sans confirmation, le workflow ne fait que LISTER (les noms des clients sont
# masqués dans le journal, qui est public).
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Numéro de la commande à garder (ex. LDD-0007). Vide = tout supprimer."
        required: false
        default: ''
      confirmation:
        description: "Tapez SUPPRIMER pour appliquer. Autre valeur = simple liste, rien n'est supprimé."
        required: false
        default: ''

jobs:
  reset:
    name: Commandes de production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le script
        id: script
        run: echo "b64=$(base64 -w0 backend/scripts/reset-orders.mongosh.js)" >> "$GITHUB_OUTPUT"

      - name: Lister, sauvegarder puis appliquer
        uses: appleboy/ssh-action@v1
        env:
          SCRIPT_B64: ${{ steps.script.outputs.b64 }}
          KEEP: ${{ inputs.keep }}
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          envs: SCRIPT_B64,KEEP,CONFIRMATION
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE_PRIVATE_KEY }}
          port: ${{ secrets.PORT || '22' }}
          script: |
            set -e
            dossier_de() { docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$1" 2>/dev/null || true; }
            D="${{ secrets.FOLDER }}"
            if [ ! -f "$D/.env" ]; then D=$(dossier_de la-delicieuse); fi
            B="$D/backend"
            if [ ! -f "$B/.env" ]; then B=$(dossier_de ladelicieuse-backend); fi

            MONGO_URI=$(grep -E '^MONGO_URI=' "$B/.env" | head -1 | cut -d= -f2- | sed -E "s/[\"'[:space:]]//g")
            if [ -z "$MONGO_URI" ]; then echo "ERREUR : MONGO_URI absent de backend/.env."; exit 1; fi
            export MONGO_URI

            TMP=$(mktemp -d)
            trap 'rm -rf "$TMP"' EXIT
            echo "$SCRIPT_B64" | base64 -d > "$TMP/reset.js"

            APPLY=0
            if [ "$CONFIRMATION" = "SUPPRIMER" ]; then APPLY=1; fi

            if [ "$APPLY" = "1" ]; then
              SAUVEGARDES="$HOME/sauvegardes-ladelicieuse"
              mkdir -p "$SAUVEGARDES"
              NOM="avant-remise-a-zero-$(date +%Y%m%d-%H%M%S).archive.gz"
              if ! docker run --rm -e MONGO_URI -v "$SAUVEGARDES":/sauvegardes mongo:7 sh -c 'mongodump --uri="$MONGO_URI" --archive=/sauvegardes/'"$NOM"' --gzip --quiet'; then
                rm -f "$SAUVEGARDES/$NOM"; echo "ERREUR : sauvegarde impossible, rien n'a été supprimé."; exit 1
              fi
              if [ ! -s "$SAUVEGARDES/$NOM" ]; then echo "ERREUR : sauvegarde vide, rien n'a été supprimé."; rm -f "$SAUVEGARDES/$NOM"; exit 1; fi
              echo "Base sauvegardée : $NOM ($(du -h "$SAUVEGARDES/$NOM" | cut -f1))"
            else
              echo "Mode liste : aucune suppression (confirmation absente)."
            fi

            docker run --rm -e MONGO_URI -e KEEP -e APPLY="$APPLY" -v "$TMP":/script:ro mongo:7 \
              sh -c 'mongosh "$MONGO_URI" --quiet --file /script/reset.js'
