name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint · typecheck · tests · build
    runs-on: ubuntu-latest

    # Vraie base MongoDB jetable pour les tests d'intégration du backend (modèles, index, migrations).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Le tsconfig.json de la racine ne contient que des références (files: []) : il ne vérifie rien.
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests (Vitest)
        run: npm run test

      # Les tests backend importent les routes : ils ont besoin des dépendances du dossier backend.
      - name: Install backend dependencies (pour les tests backend)
        run: npm ci --prefix backend

      - name: Backend tests (Vitest, dont intégration MongoDB)
        run: npm run test:backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # ── Security audit ───────────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Frontend — npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Backend — npm audit
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true
