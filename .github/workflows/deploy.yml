name: Deploy

# Le déploiement ne part qu'une fois la CI (lint, typage, tests, build) terminée AVEC SUCCÈS sur main.
# Le lancement manuel reste possible (workflow_dispatch).
#
# En production, le site et l'API tournent dans deux conteneurs Docker (voir docker-compose.yml à la racine et
# backend/docker-compose.yml). Le serveur reconstruit les images à partir des sources envoyées ici : les
# variables VITE_* et les secrets de l'API viennent des fichiers .env déjà présents sur le serveur.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production (Docker)
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      # Sans la configuration complète du serveur, un déploiement automatique ne doit ni échouer ni écrire au mauvais
      # endroit : il est ignoré avec un avertissement visible. Un lancement manuel, lui, échoue pour le signaler.
      - name: Vérifier la configuration de production
        id: config
        env:
          IP_SERVER: ${{ secrets.IP_SERVER }}
          SSH_USER: ${{ secrets.USER }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FOLDER: ${{ secrets.FOLDER }}
          DEPLOY_AUTO: ${{ vars.DEPLOY_AUTO }}
        run: |
          manquants=""
          for nom in IP_SERVER SSH_USER PRIVATE_KEY FOLDER; do
            if [ -z "${!nom}" ]; then manquants="$manquants $nom"; fi
          done
          if [ -z "$manquants" ]; then
            # Déploiement automatique : réservé au moment où le serveur est prêt (variable de dépôt DEPLOY_AUTO=true).
            # Un lancement manuel, lui, déploie toujours.
            if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$DEPLOY_AUTO" != "true" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "## Déploiement automatique désactivé" >> "$GITHUB_STEP_SUMMARY"
              echo "Définir la variable de dépôt DEPLOY_AUTO=true une fois le serveur préparé (voir PRODUCTION.md)." >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Déploiement automatique désactivé::variable DEPLOY_AUTO absente (voir PRODUCTION.md)"
              exit 0
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "## Déploiement ignoré" >> "$GITHUB_STEP_SUMMARY"
          echo "Secrets de production manquants :$manquants (Settings > Secrets and variables > Actions)." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error title=Déploiement impossible::Secrets manquants :$manquants"
            exit 1
          fi
          echo "::warning title=Déploiement ignoré::Secrets manquants :$manquants"

      # Exactement le commit que la CI vient de valider.
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Les sources suivies par git, sans .env ni node_modules : le serveur n'a pas besoin d'accéder au dépôt GitHub.
      # Les images téléversées (données des clients) ne sont jamais écrasées par celles du dépôt.
      - name: Préparer l'archive des sources
        if: steps.config.outputs.ready == 'true'
        run: git archive --format=tar.gz --output=release.tgz HEAD -- . ':(exclude)backend/public/uploads'

      # ── Vérifier le serveur avant d'y écrire quoi que ce soit ────────────────────────────────────────
      - name: Vérifier le serveur (Docker, dossier, fichiers .env)
        if: steps.config.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE_PRIVATE_KEY }}
          port: ${{ secrets.PORT || '22' }}
          script: |
            # Dossiers du site (D) et de l'API (B). Le secret FOLDER est prioritaire ; s'il ne désigne pas un dossier valide, on prend
            # celui où les conteneurs actuels ont été lancés (le chemin n'est pas affiché dans le journal, qui est public).
            dossier_de() { docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$1" 2>/dev/null || true; }
            D="${{ secrets.FOLDER }}"
            if [ ! -f "$D/.env" ]; then D=$(dossier_de la-delicieuse); fi
            B="$D/backend"
            if [ ! -f "$B/.env" ]; then B=$(dossier_de ladelicieuse-backend); fi
            if ! docker info > /dev/null 2>&1; then
              echo "ERREUR : Docker est absent ou n'est pas utilisable par l'utilisateur SSH (groupe docker)."
              exit 1
            fi
            if ! docker compose version > /dev/null 2>&1 && ! docker-compose version > /dev/null 2>&1; then
              echo "ERREUR : ni « docker compose » ni « docker-compose » n'est installé."
              exit 1
            fi
            if [ -z "$D" ] || [ ! -d "$D" ] || [ ! -w "$D" ]; then
              echo "ERREUR : dossier du site introuvable ou non modifiable par l'utilisateur SSH (secret FOLDER, voir PRODUCTION.md)."
              exit 1
            fi
            if [ ! -f "$D/.env" ]; then
              echo "ERREUR : fichier .env absent à la racine du site (VITE_API_URL, voir PRODUCTION.md)."
              exit 1
            fi
            if [ -z "$B" ] || [ ! -f "$B/.env" ] || [ ! -w "$B" ]; then
              echo "ERREUR : dossier de l'API introuvable, non modifiable, ou sans fichier .env (voir PRODUCTION.md)."
              exit 1
            fi
            echo "Serveur vérifié : Docker disponible, dossiers du site et de l'API prêts, fichiers .env présents."

      # ── Envoyer les sources ──────────────────────────────────────────────────────────────────────────
      - name: Envoyer les sources au serveur
        if: steps.config.outputs.ready == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE_PRIVATE_KEY }}
          port: ${{ secrets.PORT || '22' }}
          source: release.tgz
          target: /tmp/ladelicieuse-release

      # ── Reconstruire et relancer les deux conteneurs ─────────────────────────────────────────────────
      - name: Reconstruire et relancer les conteneurs
        if: steps.config.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE_PRIVATE_KEY }}
          port: ${{ secrets.PORT || '22' }}
          script: |
            set -e
            # Dossiers du site (D) et de l'API (B). Le secret FOLDER est prioritaire ; s'il ne désigne pas un dossier valide, on prend
            # celui où les conteneurs actuels ont été lancés (le chemin n'est pas affiché dans le journal, qui est public).
            dossier_de() { docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$1" 2>/dev/null || true; }
            D="${{ secrets.FOLDER }}"
            if [ ! -f "$D/.env" ]; then D=$(dossier_de la-delicieuse); fi
            B="$D/backend"
            if [ ! -f "$B/.env" ]; then B=$(dossier_de ladelicieuse-backend); fi
            cd "$D"

            if docker compose version > /dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi

            # Les images téléversées vivaient dans le conteneur : on les met à l'abri sur le serveur (une seule fois,
            # si le dossier est encore vide) avant de remplacer le conteneur.
            mkdir -p "$B/public/uploads"
            if [ -z "$(ls -A "$B/public/uploads" 2>/dev/null)" ] && docker inspect ladelicieuse-backend > /dev/null 2>&1; then
              docker cp ladelicieuse-backend:/app/public/uploads/. "$B/public/uploads/" 2>/dev/null \
                && echo "Images téléversées récupérées depuis l'ancien conteneur" || true
            fi

            # Sources : on dépose la nouvelle version par-dessus l'ancienne (les .env ne sont pas dans l'archive).
            tar -xzf /tmp/ladelicieuse-release/release.tgz -C "$D"
            if [ "$B" != "$D/backend" ]; then tar -xzf /tmp/ladelicieuse-release/release.tgz -C "$B" --strip-components=1 backend; fi
            rm -rf /tmp/ladelicieuse-release

            # Un conteneur du même nom créé depuis un autre dossier bloquerait « up » : on le retire (il est sans état).
            for c in ladelicieuse-backend la-delicieuse; do
              if docker inspect "$c" > /dev/null 2>&1; then
                wd=$(dossier_de "$c")
                case "$c" in ladelicieuse-backend) attendu="$B" ;; *) attendu="$D" ;; esac
                if [ "$wd" != "$attendu" ]; then docker rm -f "$c" > /dev/null; echo "Ancien conteneur $c retiré (créé depuis un autre dossier)"; fi
              fi
            done

            # API d'abord, puis le site.
            (cd "$B" && $DC up -d --build)
            $DC up -d --build

            attendre() { # $1 = nom, $2 = adresse, $3 = conteneur
              for i in $(seq 1 60); do
                if curl -fsS "$2" > /dev/null 2>&1; then echo "$1 en ligne après ${i} s"; return 0; fi
                sleep 1
              done
              echo "$1 ne répond pas après le redémarrage"
              docker logs --tail 60 "$3"
              return 1
            }
            attendre "API" "http://127.0.0.1:5402/health/live" ladelicieuse-backend
            attendre "Site" "http://127.0.0.1:5101/" la-delicieuse
            curl -fsS "http://127.0.0.1:5402/health/ready" > /dev/null || echo "Attention : /health/ready en échec (MongoDB ou Redis)"

            docker image prune -f > /dev/null
            echo "Deployment complete"
